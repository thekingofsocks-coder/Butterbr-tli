<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Butterbrot Kartenspiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: ein Bildschirm. Gegner oben, Brotbrett mit Stapeln in der Mitte, eigene Hand unten.
     Eine Welt, ein Thema: karierte Tischdecke, Holzbrett, Butter als einzige laute Farbe. */
  --cloth:#23466b;
  --cloth-hi:#34608f;
  --board:#d49c5c;
  --board-dk:#a86f35;
  --butter:#ffd84d;
  --butter-dk:#d9a414;
  --crust:#55300f;
  --card:#fffdf5;
  --ink:#1b2530;
  --red:#d3352a;
  --milk:#f6f1e3;
  --display:'Bagel Fat One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'Bricolage Grotesque','Avenir Next','Segoe UI',sans-serif;
  --cw:clamp(48px,min(16.5vw,10.6vh),78px);
  --ch:calc(var(--cw)*1.42);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background-color:var(--cloth);
  background-image:
    linear-gradient(90deg,rgba(255,255,255,.085) 50%,transparent 50%),
    linear-gradient(rgba(255,255,255,.085) 50%,transparent 50%);
  background-size:46px 46px;
  color:var(--milk);font-family:var(--body);font-size:15px;line-height:1.35;
  overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
svg{display:block}
[hidden]{display:none !important}
#app{
  height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;position:relative;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* Kopf */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px 4px}
.brand{display:flex;align-items:center;gap:8px;font:400 23px/1 var(--display);color:var(--butter);letter-spacing:.01em;text-shadow:0 2px 0 rgba(0,0,0,.28)}
.brand svg{width:28px;height:28px}
.tools{display:flex;gap:6px}
.tools button{min-height:34px;padding:0 12px;border-radius:999px;background:rgba(10,22,40,.38);color:var(--milk);font-weight:650;font-size:13px;border:1px solid rgba(255,255,255,.14)}
.tools button[aria-pressed="false"]{opacity:.55;text-decoration:line-through}

/* Gegner */
#opps{display:flex;gap:8px;padding:6px 16px 0;justify-content:center}
.opp{position:relative;flex:1 1 0;max-width:220px;min-width:0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;padding:7px 9px;border-radius:14px;background:rgba(10,22,40,.34);border:2px solid transparent;transition:border-color .2s,background .2s}
.opp.on{border-color:var(--butter);background:rgba(10,22,40,.55)}
.av{grid-row:1/3;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:400 19px/1 var(--display);color:var(--crust);box-shadow:inset 0 -3px 0 rgba(0,0,0,.16)}
.a1{background:#f0b94e}.a2{background:#f09a5e}.a3{background:#d9b58c}
.oname{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;gap:6px}
.oname span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.oname b{font:400 15px/1 var(--display);color:var(--butter);font-variant-numeric:tabular-nums}
.fan{display:flex;height:20px;padding-left:9px}
.fan i{width:14px;height:20px;margin-left:-9px;border-radius:3px;background:var(--butter);border:1.5px solid var(--card);box-shadow:0 1px 2px rgba(0,0,0,.35)}
.fan i:nth-child(odd){background:var(--butter-dk)}
.bub{position:absolute;left:50%;top:calc(100% - 6px);translate:-50% 0;z-index:30;white-space:nowrap;padding:5px 12px 6px;border-radius:10px;background:var(--butter);color:var(--crust);font:400 17px/1 var(--display);box-shadow:0 3px 0 var(--butter-dk),0 8px 16px rgba(0,0,0,.35);rotate:-3deg;animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
#meBub{position:absolute;right:18px;bottom:calc(var(--ch) + 96px);z-index:30}
#meBub .bub{position:static;translate:none;display:block}

/* Tisch */
#table{flex:1 1 auto;min-height:calc(var(--ch) + 64px);display:grid;place-items:center;padding:14px 34px 16px 44px;position:relative}
.board{
  position:relative;width:100%;max-width:470px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;
  padding:24px 16px 22px;border-radius:22px;
  background:
    repeating-linear-gradient(93deg,rgba(90,48,10,.10) 0 2px,transparent 2px 11px),
    repeating-linear-gradient(88deg,rgba(255,235,200,.08) 0 3px,transparent 3px 17px),
    linear-gradient(180deg,var(--board),#c88c4b);
  box-shadow:0 5px 0 var(--board-dk),0 18px 30px rgba(5,14,30,.45),inset 0 2px 0 rgba(255,240,210,.35);
}
.board::before{content:'';position:absolute;left:-28px;top:50%;translate:0 -50%;width:30px;height:50px;border-radius:18px 0 0 18px;background:linear-gradient(180deg,var(--board),#c88c4b);box-shadow:0 5px 0 var(--board-dk)}
.board::after{content:'';position:absolute;left:-19px;top:50%;translate:0 -50%;width:12px;height:12px;border-radius:50%;background:var(--cloth);box-shadow:inset 0 2px 2px rgba(0,0,0,.4)}
.deck{position:relative;width:var(--cw);height:var(--ch);border-radius:calc(var(--cw)*.12);
  background:
    radial-gradient(circle at 50% 50%,var(--butter) 0 22%,transparent 23%),
    repeating-linear-gradient(45deg,var(--butter-dk) 0 6px,#e9b62a 6px 12px);
  border:3px solid var(--card);box-shadow:2px 2px 0 #e9dcc0,4px 4px 0 #d8c8a6,6px 9px 12px rgba(40,20,0,.4)}
.deck b{position:absolute;inset:0;display:grid;place-items:center;font:400 calc(var(--cw)*.34)/1 var(--display);color:var(--crust);font-variant-numeric:tabular-nums}
.deck small{position:absolute;left:50%;bottom:-17px;translate:-50% 0;font-size:10.5px;font-weight:700;color:var(--crust);white-space:nowrap;opacity:.8}
.deck.can{animation:nudge 1.6s ease-in-out infinite}
#pile{position:relative;height:calc(var(--ch) + 10px);min-width:0}
.gilt{position:absolute;left:50%;translate:-50% 0;top:-16px;z-index:24;display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--ink);color:var(--milk);font-size:12.5px;font-weight:700;box-shadow:0 3px 8px rgba(0,0,0,.35);white-space:nowrap}
.gilt i{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--card);color:var(--ink)}
.gilt i.red{color:var(--red)}
.gilt svg{width:13px;height:13px}
.pen{position:absolute;right:-18px;top:-16px;z-index:25;min-width:58px;height:58px;padding:0 8px;border-radius:50%;display:grid;place-content:center;text-align:center;background:var(--butter);color:var(--crust);rotate:9deg;box-shadow:0 3px 0 var(--butter-dk),0 8px 14px rgba(0,0,0,.35);animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.pen b{font:400 24px/1 var(--display);font-variant-numeric:tabular-nums}
.pen span{font-size:9.5px;font-weight:800;line-height:1.05;text-transform:uppercase;letter-spacing:.03em}
.pen.me{background:var(--red);color:#fff;box-shadow:0 3px 0 #8f1d15,0 8px 14px rgba(0,0,0,.35)}

/* Karten */
.card{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);border-radius:calc(var(--cw)*.12);background:var(--card);color:var(--ink);border:1px solid rgba(20,30,50,.22);box-shadow:0 1px 0 rgba(0,0,0,.2),0 5px 12px rgba(8,16,34,.3);font-family:var(--body);overflow:hidden}
.card.red{color:var(--red)}
.card .ix{position:absolute;left:calc(var(--cw)*.075);top:calc(var(--cw)*.06);display:flex;flex-direction:column;align-items:center;gap:1px;width:calc(var(--cw)*.3)}
.card .ix b{font-weight:800;font-size:calc(var(--cw)*.29);line-height:1;letter-spacing:-.04em}
.card .ix svg{width:calc(var(--cw)*.2);height:calc(var(--cw)*.2)}
.card .ix i{font-style:normal;font-size:calc(var(--cw)*.17);font-weight:800;line-height:1;margin-top:2px;padding:2px 3px;border-radius:4px;background:var(--ink);color:var(--card);white-space:nowrap}
.card.red .ix i{background:var(--red)}
.card .mid{position:absolute;inset:0;display:grid;place-items:center;padding-top:calc(var(--cw)*.2);padding-left:calc(var(--cw)*.16)}
.card .mid svg{width:calc(var(--cw)*.44);height:calc(var(--cw)*.44)}
.card .face{font:400 calc(var(--cw)*.6)/1 var(--display)}
.card .fx{position:absolute;right:calc(var(--cw)*.08);bottom:calc(var(--cw)*.06);font-size:calc(var(--cw)*.15);font-weight:800;letter-spacing:.02em;text-transform:uppercase;opacity:.62}
.card .tag{position:absolute;left:3px;right:3px;bottom:3px;display:flex;align-items:center;justify-content:center;gap:3px;padding:2px 0;border-radius:6px;background:var(--ink);color:var(--milk);font-size:calc(var(--cw)*.16);font-weight:800;white-space:nowrap}
.card .tag svg{width:calc(var(--cw)*.17);height:calc(var(--cw)*.17)}
.card .tag .r{color:#ff8d84}
.pc{left:50%;top:50%;margin:calc(var(--ch)*-.5) 0 0 calc(var(--cw)*-.5);transition:transform .32s cubic-bezier(.2,.8,.3,1);animation:land .34s cubic-bezier(.2,.9,.3,1) backwards}

/* Hand */
#me{position:relative;padding:0 0 8px}
#me.on::before{content:'';position:absolute;left:16px;right:16px;top:-2px;height:3px;border-radius:3px;background:var(--butter);box-shadow:0 0 14px var(--butter)}
#status{min-height:44px;padding:4px 18px 6px;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;text-align:center}
#status .last{font-size:12.5px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status .now{font-size:14.5px;font-weight:700;text-wrap:balance}
#status .now.bad{color:#ffb3ab}
#status .now.tip{color:var(--butter)}
#combo{display:flex;gap:6px;justify-content:safe center;overflow-x:auto;scrollbar-width:none;min-height:0;padding:0 16px 4px}
#combo::-webkit-scrollbar{display:none}
#combo button{flex:none;white-space:nowrap}
#combo button{padding:5px 11px;border-radius:999px;background:var(--butter);color:var(--crust);font-size:12.5px;font-weight:800;box-shadow:0 2px 0 var(--butter-dk)}
#hand{height:calc(var(--ch) + 28px);overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scrollbar-width:none;padding:0 12px}
#hand::-webkit-scrollbar{display:none}
#track{position:relative;height:100%;min-width:100%}
.hc{transition:transform .22s cubic-bezier(.2,.8,.3,1),filter .2s,box-shadow .2s}
.hc.new{animation:drawIn .38s cubic-bezier(.2,.9,.3,1)}
.hc.dim{filter:brightness(.72) saturate(.7)}
.hc.sel{box-shadow:0 0 0 3px var(--butter),0 10px 18px rgba(8,16,34,.45)}
.hc.shake{animation:shake .3s}
#actions{display:grid;grid-template-columns:auto auto 1fr 1.25fr;gap:8px;padding:6px 16px 4px}
#actions button{min-height:48px;border-radius:14px;font-weight:800;font-size:15px;padding:0 14px;background:rgba(10,22,40,.5);color:var(--milk);border:1px solid rgba(255,255,255,.16);transition:opacity .15s,transform .08s}
#actions button:active{transform:translateY(2px)}
#actions button:disabled{opacity:.38}
#actions #bPlay{background:var(--butter);color:var(--crust);border:0;box-shadow:0 4px 0 var(--butter-dk);font:400 19px/1 var(--display);letter-spacing:.02em}
#actions #bPlay:disabled{box-shadow:0 4px 0 rgba(0,0,0,.2)}
#actions #bDraw.pulse{animation:nudge .5s 2}
#bSort{font-size:12.5px !important;line-height:1.05;padding:0 10px !important}

/* Butter und Brot */
#callZone{position:absolute;left:0;right:0;bottom:calc(var(--ch) + 104px);z-index:60;display:grid;place-items:center;pointer-events:none}
#callZone[hidden]{display:none}
.pat{pointer-events:auto;position:relative;padding:20px 44px 24px;border-radius:18px;background:linear-gradient(180deg,#ffe57a,var(--butter));color:var(--crust);font:400 40px/1 var(--display);rotate:-3deg;box-shadow:0 8px 0 var(--butter-dk),0 22px 34px rgba(0,0,0,.45),inset 0 3px 0 rgba(255,255,255,.55);animation:pop .25s cubic-bezier(.3,1.7,.5,1);overflow:hidden}
.pat:active{translate:0 5px;box-shadow:0 3px 0 var(--butter-dk),0 10px 18px rgba(0,0,0,.4)}
.pat.brot{background:linear-gradient(180deg,#e7b575,#cf9450);color:#fff7e6;box-shadow:0 8px 0 #8d5a25,0 22px 34px rgba(0,0,0,.45),inset 0 3px 0 rgba(255,255,255,.3)}
.pat i{position:absolute;left:0;bottom:0;height:7px;width:100%;background:rgba(85,48,15,.55);transform-origin:left;animation:drain linear forwards}

/* Blätter */
#sheet{position:absolute;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,18,34,.62);animation:fade .18s}
#sheet[hidden]{display:none}
.panel{width:100%;max-width:560px;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--milk);color:var(--ink);border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.4);animation:rise .28s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;gap:14px;-webkit-user-select:text;user-select:text}
.panel h1{margin:0;font:400 44px/0.95 var(--display);color:var(--crust);text-wrap:balance}
.panel h2{margin:0;font:400 26px/1.05 var(--display);color:var(--crust);text-wrap:balance}
.panel h3{margin:6px 0 -6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#7a6a55}
.panel p{margin:0;max-width:62ch}
.panel .sub{color:#5a5248}
.hero{display:flex;align-items:center;gap:14px}
.hero svg{width:76px;height:76px;flex:none;rotate:-6deg;filter:drop-shadow(0 6px 8px rgba(60,30,0,.3))}
.opt{display:grid;grid-template-columns:1fr;gap:6px}
.opt>span{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#7a6a55}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;border-radius:12px;background:#e9e1cd;font-weight:750;font-size:14px;color:var(--ink);border:2px solid transparent}
.seg button[aria-pressed="true"]{background:var(--butter);color:var(--crust);border-color:var(--butter-dk)}
.seg button:disabled{opacity:.35}
.primary{min-height:54px;border-radius:16px;background:var(--butter);color:var(--crust);font:400 23px/1 var(--display);box-shadow:0 5px 0 var(--butter-dk)}
.primary:active{translate:0 3px;box-shadow:0 2px 0 var(--butter-dk)}
.ghost{min-height:46px;border-radius:14px;font-weight:750;color:var(--crust);background:transparent;border:2px solid #d8cdb4}
.suits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px 9px;border-radius:14px;background:var(--card);border:2px solid #dcd2bb;color:var(--ink);font-weight:750;font-size:12.5px;box-shadow:0 3px 0 #dcd2bb}
.sbtn.red{color:var(--red)}
.sbtn svg{width:30px;height:30px}
.sbtn small{font-size:10.5px;font-weight:700;color:#6b6257;text-align:center;line-height:1.1}
.rows{display:flex;flex-direction:column;gap:8px}
.rbtn{display:grid;gap:5px;text-align:left;padding:11px 13px;border-radius:14px;background:var(--card);border:2px solid #dcd2bb;box-shadow:0 3px 0 #dcd2bb;font-weight:750}
.rbtn small{font-weight:650;color:#6b6257}
.minis{display:flex;gap:3px;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:2px;padding:3px 6px;border-radius:6px;background:#f1ead8;border:1px solid #d9cfb8;font-weight:800;font-size:13px;color:var(--ink)}
.mini.red{color:var(--red)}
.mini svg{width:11px;height:11px}
.mini.j{background:var(--ink);color:var(--milk);border-color:var(--ink)}
.mini.j.red{color:#ff8d84}
.tally{display:grid;gap:6px}
.tally div{display:flex;justify-content:space-between;padding:9px 13px;border-radius:12px;background:#ece4d0;font-weight:750}
.tally div.win{background:var(--butter);color:var(--crust)}
.tally b{font-variant-numeric:tabular-nums}
.rules{display:grid;gap:10px}
.rules section{padding:13px 14px;border-radius:14px;background:#fffdf5;border:1px solid #e2d8c0;display:grid;gap:7px}
.rules h4{margin:0;font:400 19px/1.1 var(--display);color:var(--crust)}
.rules ul{margin:0;padding-left:18px;display:grid;gap:5px}
.rules .k{display:inline-block;min-width:22px;padding:0 5px;border-radius:5px;background:var(--ink);color:var(--milk);font-weight:800;text-align:center}
.loglist{display:grid;gap:4px;font-size:13.5px}
.loglist div{padding:6px 10px;border-radius:9px;background:#ece4d0}
.timer{height:6px;border-radius:3px;background:#d8cdb4;overflow:hidden}
.timer i{display:block;height:100%;background:var(--red);transform-origin:left;animation:drain linear forwards}

@keyframes pop{from{scale:.4;opacity:0}to{scale:1;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{translate:0 40px;opacity:0}to{translate:0 0;opacity:1}}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes land{from{translate:0 var(--fy,-130px);scale:1.25;opacity:0}to{translate:0 0;scale:1;opacity:1}}
@keyframes drawIn{from{translate:0 -70px;scale:.7;opacity:0}to{translate:0 0;scale:1;opacity:1}}
@keyframes shake{25%{translate:-5px 0}50%{translate:5px 0}75%{translate:-3px 0}}
@keyframes nudge{0%,100%{translate:0 0}50%{translate:0 -4px}}
@media (prefers-reduced-motion:reduce){
  *:not(.tm),*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
@media (max-width:380px){
  .bar{padding:6px 12px 2px}.brand{font-size:20px}
  #opps{padding:4px 10px 0;gap:6px}.opp{padding:6px 7px}.av{width:30px;height:30px;font-size:16px}
  #actions{padding:6px 10px 4px;gap:6px}#actions button{padding:0 10px}
}
@media (max-height:620px){
  #status{min-height:36px}.bar{padding-top:4px}#table{padding-top:10px;padding-bottom:14px}
}

/* Online */
.primary.alt{background:var(--ink);color:var(--butter);box-shadow:0 5px 0 #05090f}
.primary.alt:active{box-shadow:0 2px 0 #05090f}
.panel input[type=text]{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:2px solid #d8cdb4;background:var(--card);color:var(--ink);font:650 17px/1 var(--body);-webkit-user-select:text;user-select:text}
.panel input[type=text]:focus{outline:3px solid var(--butter);outline-offset:1px;border-color:var(--butter-dk)}
.panel input[type=text]:disabled{opacity:.6}
#lobbyState{display:grid;gap:8px;min-height:26px}
#lobbyState .warn{color:#9a2118;font-weight:650}
.peers{display:flex;flex-wrap:wrap;gap:6px}
.peers span{padding:5px 11px;border-radius:999px;background:#ece4d0;font-weight:700;font-size:13px}
.oname em{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--butter);margin-left:4px}
#status .last.warn{opacity:1;color:#ffb3ab;font-weight:700}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="su0" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21C5 16 2 12.3 2 8.4 2 5.4 4.2 3.5 6.8 3.5c2.1 0 4 1.2 5.2 3.2 1.2-2 3.1-3.2 5.2-3.2C19.8 3.5 22 5.400 22 8.4 22 12.3 19 16 12 21z"/></symbol>

    turn: S.turn, pend: { b: S.pend.b, c: S.pend.c, r: S.pend.r, suits: S.pend.suits.slice() },

  /* ---------- Eingabe ---------- */
  function humanInput() {

  function submit(act) { const w = ui.waiting; if (!w) return; ui.waiting = null; ui.moves = []; ui.tip = null; w(act); }
  function tapCard(id) {

  /* ---------- Spielablauf (läuft allein oder beim Gastgeber des Onlinespiels) ---------- */
  const ck = my => { if (!G || G.id !== my) throw CANCEL; };
  const pause = async (my, ms) => { await sleep(ms); ck(my); };
  function tagPile(mv, p) {
    const S = G.S, n = mv.cards.length;
    G.mv++;
    for (let i = 0; i < n; i++) {
      const e = S.pile[S.pile.length - n + i], c = mv.cards[i];
      e.k = ++G.pk; e.m = G.mv; e.by = p;
      if (cr(c.id) === RJ) e.t = mv.jack === 'wish' ? 'w' : (c.r !== RJ || c.s !== cs(c.id)) ? 'a' : undefined;
    }
  }
  function checkShuffle() {
    if (G.S.shuffles !== ui.shuffles) { ui.shuffles = G.S.shuffles; say('Der Ablagestapel wird neu gemischt.'); }
  }
  function humanCall(kind) {
    return new Promise(res => {
      const z = $('#callZone'), ms = 3500;
      if (ui.callFin) ui.callFin(false);
      let done = false;
      const fin = ok => { if (done) return; done = true; clearTimeout(t); if (ui.callFin === fin) ui.callFin = null; z.hidden = true; z.innerHTML = ''; res(ok); };
      ui.callFin = fin;
      z.innerHTML = `<button type="button" class="pat ${kind}" id="pat"><span>${kind === 'butter' ? 'Butter!' : 'Brot!'}</span><i class="tm" style="animation-duration:${ms}ms"></i></button>`;
      z.hidden = false;
      const t = setTimeout(() => fin(false), ms);
      $('#pat').addEventListener('click', () => fin(true));
      ui.now = kind === 'butter' ? 'Schnell: Butter rufen!' : 'Schnell: Brot rufen!';
      renderStatus();
    });
  }
  /* Frage an das andere Gerät: Zug, Ruf oder Bombe */
  function ask(req, ms, dflt) {
    return new Promise(res => {
      const id = ++G.rid, g = G;
      g.req = Object.assign({ id }, req);
      let done = false;
      const fin = v => { if (done) return; done = true; clearTimeout(t); if (g.req && g.req.id === id) g.req = null; g.onAns = null; res(v); };
      const t = ms ? setTimeout(() => fin(dflt), ms) : 0;
      g.onAns = m => { if (m && m.id === id) fin(m); };
      pushView(false);
    });
  }
  const sig = m => m.kind + '|' + m.cards.map(c => c.id + '.' + c.r + '.' + c.s).join(',') + '|' + (m.pickup ? 1 : 0);
  function matchMove(list, mv) {
    try { const want = sig(mv); return list.find(m => sig(m) === want) || null; } catch (e) { return null; }
  }
  const packMove = m => ({ kind: m.kind, pickup: !!m.pickup, jack: m.jack, cards: m.cards.map(c => ({ id: c.id, r: c.r, s: c.s })) });

  async function call(my, p, kind) {
    const word = kind === 'butter' ? 'Butter!' : 'Brot!';
    if (isRemote(p)) {
      const m = await ask({ kind: 'call', call: kind }, 7000, { ok: false }); ck(my);
      if (m.ok) { bubble(p, word); sfx(kind); await pause(my, 300); }
      return !!m.ok;
    }
    if (p !== 0) {
      if (Math.random() < FORGET[cfg.level] * (kind === 'brot' ? 0.5 : 1)) return false;
      bubble(p, word); sfx(kind); await pause(my, 700); return true;
    }
    if (cfg.calls === 'auto' && !G.online) { bubble(0, word); sfx(kind); await pause(my, 500); return true; }
    const ok = await humanCall(kind); ck(my);
    if (ok) { bubble(0, word); sfx(kind); buzz(20); await pause(my, 300); }
    return ok;
  }
  async function interrupt(my, p) {
    const S = G.S;
    for (let k = 1; k < S.n; k++) {
      const q = (p + k) % S.n;
      let mv = null;
      if (isRemote(q)) {
        const bombs = bombMoves(S, S.hands[q], true);
        if (bombs.length) {
          const m = await ask({ kind: 'bomb', by: p }, 18000, {}); ck(my);
          if (m.mv) mv = matchMove(bombs, m.mv);
        }
      } else if (q === 0) {
        const bombs = bombMoves(S, S.hands[0], true);
        if (bombs.length) {
          const yes = await confirmTimed(`${pname(p)} will ausmachen`, `${pname(p)} hat Butter gerufen und ist nach der 8 nochmal dran. Nur eine Bombe hält das jetzt auf.`, 'Bombe werfen', 'Laufen lassen', 8000);
          ck(my);
          if (yes) { mv = await choose('Bombe werfen', bombs); ck(my); }
        }
      } else mv = botInterrupt(S, q, cfg.level);
      if (mv) {
        say(v => (q === v ? 'Du wirfst eine Bombe dazwischen.' : `${pname(q)} wirft eine Bombe dazwischen.`));
        await doPlay(my, q, mv, true);
        return true;
      }
    }
    return false;
  }
  async function afterPlay(my, p, before, r) {
    const S = G.S, N = pname(p);
    if (S.hands[p].length === 1 && S.owed === 0 && before > 1) {
      const ok = await call(my, p, 'butter');
      if (!ok) { drawCards(S, p, 2); say(v => (p === v ? 'Butter vergessen. Du ziehst 2.' : `${N} vergisst Butter und zieht 2.`)); sfx('err'); checkShuffle(); render(); await pause(my, 1000); }
    }
    if (r.cont) {
      if (S.hands[p].length === 1 && S.owed === 0) await interrupt(my, p);
      return;
    }
    if (S.hands[p].length === 0 && S.owed === 0) {
      const ok = await call(my, p, 'brot');
      if (!ok) { S.owed += 2; say(v => (p === v ? 'Brot vergessen. Das kostet 2 Karten.' : `${N} vergisst Brot. Das kostet 2 Karten.`)); sfx('err'); }
    }
    const drawn = endTurn(S);
    if (drawn.length) {
      const w = drawn.length === 1 ? 'Strafkarte' : 'Strafkarten';
      say(v => (p === v ? `Du ziehst ${drawn.length} ${w}.` : `${N} zieht ${drawn.length} ${w}.`));
      sfx('draw'); checkShuffle(); render(); await pause(my, 700);
    } else render();
  }
  async function doPlay(my, p, mv, inter) {
    const S = G.S, before = S.hands[p].length;
    const r = inter ? applyInterrupt(S, p, mv) : applyPlay(S, mv);
    tagPile(mv, p);
    if (p === 0) { ui.sel.clear(); ui.tip = null; ui.now = ''; }
    say(v => moveText(p, mv, r, v));
    sfx(mv.kind === 'bomb' ? 'bomb' : 'play'); buzz(mv.kind === 'bomb' ? 60 : 10);
    render();
    await pause(my, mv.cards.length > 1 ? 1000 : p === 0 ? 420 : isRemote(p) ? 500 : 800);
    await afterPlay(my, p, before, r);
  }
  async function doDraw(my, p) {
    const S = G.S, cov = S.cover, N = pname(p);
    const k = applyDraw(S).length;
    if (p === 0) { ui.sel.clear(); ui.tip = null; }
    if (!k) say('Es liegen keine Karten mehr zum Ziehen bereit.');
    else if (cov) say(v => (p === v ? `Du deckst die 8 nicht und ziehst ${k}.` : `${N} kann die 8 nicht decken und zieht ${k}.`));
    else say(v => (p === v ? `Du ziehst ${k}.` : `${N} zieht ${k}.`));
    sfx('draw'); checkShuffle(); render();
    await pause(my, p === 0 ? 380 : isRemote(p) ? 420 : 700);
  }
  async function step(my) {
    const S = G.S, p = S.turn;
    let act;
    if (S.cover && !S.hands[p].length) { act = { draw: true }; await pause(my, 400); }
    else if (p === 0) {
      ui.now = turnText();
      if (G.rem) G.rem.now = `${pname(0)} ist ${S.seg ? 'nochmal ' : ''}dran.`;
      act = await humanInput(); ck(my);
    } else if (isRemote(p)) {
      ui.now = `${pname(p)} ist ${S.seg ? 'nochmal ' : ''}dran.`; G.rem.now = '';
      render();
      act = null;
      while (!act) {
        const m = await ask({ kind: 'turn' }); ck(my);
        const a = m.act || {};
        if (a.draw) act = { draw: true };
        else if (a.mv) { const f = matchMove(genMoves(S, S.hands[p], true), a.mv); if (f) act = { mv: f }; }
      }
    } else {
      ui.now = S.seg === 0 ? `${pname(p)} überlegt.` : `${pname(p)} ist nochmal dran.`;
      render();
      await pause(my, S.seg === 0 ? 750 + Math.random() * 450 : 560);
      const pl = botPlan(S, cfg.level);
      act = pl.seq.length ? { mv: pl.seq[0] } : { draw: true };
    }
    if (act.draw) await doDraw(my, p); else await doPlay(my, p, act.mv, false);
  }
  async function loop() {
    const my = G.id;
    try {
      while (G && G.id === my && !G.S.over) await step(my);
      ck(my);
      const w = G.S.winner;
      G.tally[w]++; if (!G.online) save('bb_tally', tally);
      ui.now = w === 0 ? 'Gewonnen!' : `${pname(w)} gewinnt.`;
      if (G.rem) G.rem.now = w === 1 ? 'Gewonnen!' : `${pname(w)} gewinnt.`;
      sfx(w === 0 ? 'win' : 'lose'); render();
      await pause(my, 1100);
      endSheet();
    } catch (e) { if (e !== CANCEL) throw e; }
  }
  function resetBoard() {
    ui.sel.clear(); ui.waiting = null; ui.moves = []; ui.tip = null; ui.bubble = {}; ui.shuffles = 0; ui.warn = '';
    for (const e of handEls.values()) e.remove(); handEls.clear();
    for (const e of pileEls.values()) e.remove(); pileEls.clear();
    if (ui.callFin) ui.callFin(false);
    $('#callZone').hidden = true; $('#callZone').innerHTML = '';
  }
  function deal(started, online) {
    resetBoard();
    const round = online ? ++net.round : started ? ++roundSP : roundSP;
    const n = online ? 2 : cfg.opp + 1, hs = online ? 7 : handOk(cfg.opp, cfg.hand) ? cfg.hand : 7;
    const S = newGame(n, hs, started ? round - 1 : 0);
    Object.assign(S.pile[0], { k: 0, m: 0, by: -1 });
    G = { id: ++gid, S, round, pk: 0, mv: 0, log: [], started, names: online ? [net.name, net.peerName] : BOTS.slice(0, n), tally: online ? net.tally : tally.w };
    if (online) Object.assign(G, { online: true, role: 'host', rem: { last: '', now: '', log: [], sfx: { n: 0, k: '' } }, vc: 0, rid: 0, req: null, onAns: null, lastBody: '' });
    if (started) say(v => `Runde ${round}${online ? ' gegen ' + pname(v === 0 ? 1 : 0) : ''}. ${S.turn === v ? 'Du beginnst' : pname(S.turn) + ' beginnt'}.`);
    else ui.last = 'Die Karten liegen bereit.';
    ui.now = started ? '' : 'Tippe auf Austeilen.';
    render();
  }
  function startRound(online) { deal(true, online); loop(); }

  /* ---------- Online: Verbindung, Lobby, Zusammenführen ---------- */
  let libP = null;
  function loadLib() {
    if (window.mqtt) return Promise.resolve();
    if (libP) return libP;
    libP = new Promise((ok, bad) => {
      const s = document.createElement('script');
      const t = setTimeout(() => bad(new Error('timeout')), 12000);
      s.src = NET.lib;
      s.onload = () => { clearTimeout(t); window.mqtt ? ok() : bad(new Error('lib')); };
      s.onerror = () => { clearTimeout(t); bad(new Error('lib')); };
      document.head.appendChild(s);
    });
    libP.catch(() => { libP = null; });
    return libP;
  }
  function send(to, obj) {
    try { if (net.client && to) net.client.publish(TOP.user(to), JSON.stringify(obj), { qos: 1 }); } catch (e) { }
  }
  function announce() {
    try {
      if (net.client && net.client.connected && net.state !== 'off')
        net.client.publish(TOP.lobby(), JSON.stringify({ id: net.id, name: net.name, st: net.state === 'lobby' ? 'free' : 'busy' }), { qos: 0 });
    } catch (e) { }
  }
  async function netConnect() {
    net.state = 'connecting'; lobbyRender();
    try { await loadLib(); } catch (e) { if (net.state === 'connecting') { net.state = 'error'; lobbyRender(); } return; }
    if (net.state !== 'connecting') return;
    let i = 0;
    const tryNext = () => {
      if (net.state !== 'connecting') return;
      if (i >= NET.brokers.length) { net.client = null; net.state = 'error'; lobbyRender(); return; }
      const url = NET.brokers[i++];
      let c, up = false, dead = false;
      try {
        c = window.mqtt.connect(url, {
          clientId: 'bb_' + net.id + '_' + Date.now().toString(36), clean: true, keepalive: 20, reconnectPeriod: 2500, connectTimeout: 7000,
          will: { topic: TOP.lobby(), payload: JSON.stringify({ id: net.id, bye: 1 }), qos: 0, retain: false }
        });
      } catch (e) { tryNext(); return; }
      net.client = c;
      const fail = () => { if (up || dead) return; dead = true; clearTimeout(to); try { c.end(true); } catch (e) { } if (net.client === c) tryNext(); };
      const to = setTimeout(fail, 8500);
      c.on('connect', () => {
        if (net.client !== c) { try { c.end(true); } catch (e) { } return; }
        up = true; clearTimeout(to);
        c.subscribe([TOP.lobby(), TOP.user(net.id)], { qos: 1 }, () => {
          if (net.client !== c) return;
          if (net.state === 'connecting') { net.state = 'lobby'; net.peers.clear(); }
          if (!net.tick) net.tick = setInterval(netTick, 1000);
          announce(); lobbyRender();
        });
      });
      c.on('error', fail);
      c.on('close', fail);
      c.on('message', (topic, payload) => {
        if (net.client !== c) return;
        let m; try { m = JSON.parse(payload.toString()); } catch (e) { return; }
        if (!m || typeof m !== 'object') return;
        try { if (topic === TOP.lobby()) onLobby(m); else onDirect(m); } catch (e) { }
      });
    };
    tryNext();
  }
  function netOff() {
    clearInterval(net.tick); net.tick = 0; clearTimeout(net.invTo);
    const c = net.client;
    try {
      if (c && c.connected) {
        if (net.state === 'game' && net.peerId) send(net.peerId, { t: 'bye', room: net.room, from: net.id });
        c.publish(TOP.lobby(), JSON.stringify({ id: net.id, bye: 1 }), { qos: 0 });
      }
    } catch (e) { }
    net.client = null; net.state = 'off'; net.peers.clear(); net.peerId = null; net.room = ''; net.role = null;
    if (c) setTimeout(() => { try { c.end(true); } catch (e) { } }, 400);
  }
  function onLobby(m) {
    if (m.id === net.id || typeof m.id !== 'string') return;
    if (m.bye) net.peers.delete(m.id);
    else net.peers.set(m.id, { name: cleanName(m.name) || 'Gast', st: m.st === 'free' ? 'free' : 'busy', t: Date.now() });
    match(); lobbyRender();
  }
  function match() {
    if (net.state !== 'lobby') return;
    const now = Date.now();
    const free = [...net.peers].filter(([id, p]) => p.st === 'free' && now - p.t < 8000 && !(net.skip[id] > now)).map(([id]) => id);
    if (!free.length) return;
    const all = free.concat([net.id]).sort();
    if (all[0] !== net.id) return;                 // die Person mit der kleineren Kennung lädt ein
    const target = all[1];
    net.state = 'inviting'; net.peerId = target; net.room = net.id + '-' + now.toString(36);
    send(target, { t: 'invite', from: net.id, name: net.name, room: net.room });
    announce();
    clearTimeout(net.invTo);
    net.invTo = setTimeout(() => { if (net.state === 'inviting') { net.skip[target] = Date.now() + 8000; net.state = 'lobby'; net.peerId = null; announce(); lobbyRender(); } }, 6000);
  }
  function onDirect(m) {
    if (m.t === 'invite') {
      if (net.state === 'lobby' && typeof m.from === 'string' && typeof m.room === 'string') {
        net.state = 'game'; net.role = 'guest'; net.peerId = m.from; net.peerName = cleanName(m.name) || 'Gast'; net.room = m.room; net.lastPeer = Date.now();
        send(m.from, { t: 'accept', from: net.id, name: net.name, room: m.room });
        announce(); startGuest();
      } else if (!(net.state === 'game' && m.room === net.room)) send(m.from, { t: 'decline', from: net.id, room: m.room });
      return;
    }
    if (m.room !== net.room || m.from !== net.peerId) return;
    if (m.t === 'accept') {
      if (net.state !== 'inviting') return;
      clearTimeout(net.invTo);
      net.state = 'game'; net.role = 'host'; net.peerName = cleanName(m.name) || 'Gast'; net.lastPeer = Date.now();
      announce(); startHost();
      return;
    }
    if (m.t === 'decline') {
      if (net.state === 'inviting') { clearTimeout(net.invTo); net.skip[m.from] = Date.now() + 8000; net.state = 'lobby'; net.peerId = null; announce(); lobbyRender(); }
      return;
    }
    if (net.state !== 'game') return;
    net.lastPeer = Date.now();
    if (ui.warn) { ui.warn = ''; renderStatus(); }
    if (m.t === 'view' && net.role === 'guest') onView(m);
    else if (m.t === 'ans' && net.role === 'host') { if (G && G.onAns) G.onAns(m); }
    else if (m.t === 'again' && net.role === 'host') { if (G && G.online && G.S.over) { if (ui.sheetTag === 'end') closeSheet(); startRound(true); } }
    else if (m.t === 'bye') endOnline('left');
  }
  function netTick() {
    const now = Date.now();
    for (const [id, p] of net.peers) if (now - p.t > 9000) net.peers.delete(id);
    if (++net.beat % 3 === 0) {
      announce();
      if (net.state === 'game') { if (net.role === 'host') pushView(true); else send(net.peerId, { t: 'ping', room: net.room, from: net.id }); }
    }
    if (net.state === 'lobby') match();
    if (net.state === 'game') {
      const quiet = now - net.lastPeer;
      if (quiet > 45000) { endOnline('lost'); return; }
      const w = quiet > 10000 ? `Warte auf ${net.peerName}. Die Verbindung hängt.` : '';
      if (w !== (ui.warn || '')) { ui.warn = w; renderStatus(); }
      if (net.role === 'guest' && G && !G.S && quiet > 12000) { endOnline('lost'); return; }
    }
    lobbyRender();
  }
  function lobbyRender() {
    if (ui.sheetTag !== 'lobby') return;
    const el = $('#lobbyState'), btn = $('#lobbyBtn');
    if (!el || !btn) return;
    const st = net.state;
    let h = '';
    if (st === 'connecting') h = '<p>Verbinde mit dem Spielserver.</p>';
    else if (st === 'error') h = '<p class="warn">Keine Verbindung zum Spielserver. In der Vorschau bei Claude ist das Netz gesperrt, auf einer normal gehosteten Seite klappt es. Sonst gleich nochmal versuchen.</p>';
    else if (st !== 'off') {
      const now = Date.now(), others = [...net.peers.values()].filter(p => now - p.t < 9000);
      h = `<p><b>Du bist online als ${esc(net.name)}.</b> ${st === 'inviting' || st === 'game' ? 'Mitspieler gefunden, das Spiel startet.' : 'Sobald eine zweite Person sucht, geht es los.'}</p>` +
        (others.length ? `<div class="peers">${others.map(p => `<span>${esc(p.name)} ${p.st === 'free' ? 'sucht auch' : 'spielt gerade'}</span>`).join('')}</div>` : '<p class="sub">Gerade ist sonst niemand hier. Schick jemandem den Link.</p>');
    }
    if (el.innerHTML !== h) el.innerHTML = h;
    const searching = st !== 'off' && st !== 'error';
    btn.textContent = searching ? 'Suche abbrechen' : 'Mitspieler suchen';
    btn.dataset.mode = searching ? 'stop' : 'search';
    btn.className = searching ? 'ghost' : 'primary';
    $('#nick').disabled = searching;
  }
  function onlineSheet(auto) {
    openSheet(`<h2>Online 1:1</h2>
      <p class="sub">Wer diese Seite gleichzeitig offen hat und auch sucht, wird dein Gegner. Gespielt wird mit 7 Karten, Butter und Brot ruft ihr selbst.</p>
      <label class="opt" for="nick"><span>Dein Name</span><input id="nick" type="text" maxlength="14" autocomplete="nickname" placeholder="Wie heisst du?" value="${esc(cfg.name || '')}"></label>
      <div id="lobbyState" aria-live="polite"></div>
      <button type="button" class="primary" id="lobbyBtn" data-mode="search">Mitspieler suchen</button>
      <button type="button" class="ghost" data-copy="1">Link kopieren</button>
      <button type="button" class="ghost" data-back="1">Zurück</button>`,
      b => {
        if (b.id === 'lobbyBtn') {
          if (b.dataset.mode === 'stop') { netOff(); lobbyRender(); return; }
          goSearch();
        } else if (b.dataset.copy) {
          const done = t => { b.textContent = t; setTimeout(() => { b.textContent = 'Link kopieren'; }, 1800); };
          try { navigator.clipboard.writeText(location.href).then(() => done('Link kopiert'), () => done('Kopieren geht hier nicht')); } catch (e) { done('Kopieren geht hier nicht'); }
        } else if (b.dataset.back) { netOff(); closeSheet(); startSheet(); }
      }, null, 'lobby');
    lobbyRender();
    if (auto) goSearch();
  }
  function goSearch() {
    const inp = $('#nick');
    cfg.name = cleanName(inp ? inp.value : cfg.name) || 'Gast ' + (10 + ((Math.random() * 90) | 0));
    if (inp) inp.value = cfg.name;
    save('bb_cfg', cfg);
    net.name = cfg.name;
    netConnect();
  }
  function onlineMenu() {
    openSheet(`<h2>Onlinespiel gegen ${esc(net.peerName)}</h2><p class="sub">Wenn du gehst, ist das Spiel für euch beide vorbei.</p>
      <button type="button" class="primary" data-back="1">Weiterspielen</button>
      <button type="button" class="ghost" data-rules="1">Regeln lesen</button>
      <button type="button" class="ghost" data-leave="1">Spiel verlassen</button>`,
      b => { if (b.dataset.back) closeSheet(); else if (b.dataset.rules) rulesSheet(onlineMenu); else if (b.dataset.leave) endOnline('leave'); }, () => { }, 'menu');
  }
  function endOnline(reason) {
    const peer = net.peerName || 'Dein Mitspieler';
    netOff();
    gid++;
    closeSheet();
    net.round = 0; net.tally = [0, 0];
    G = null;
    deal(false, false);
    const msg = reason === 'left' ? `${peer} hat das Spiel verlassen.` : reason === 'lost' ? 'Die Verbindung ist abgebrochen.' : 'Du hast das Onlinespiel verlassen.';
    openSheet(`<h2>${esc(msg)}</h2>
      <button type="button" class="primary" data-on="1">Neuen Mitspieler suchen</button>
      <button type="button" class="ghost" data-menu="1">Zum Menü</button>`,
      b => { if (b.dataset.on) onlineSheet(true); else startSheet(); }, null, 'gone');
  }

  /* ---------- Online: Gastgeber schickt die Sicht, Gast zeigt sie ---------- */
  function viewFor(v) {
    const S = G.S, n = S.n, rot = p => (p < 0 ? p : (p - v + n) % n), rotArr = a => a.map((_, i) => a[(i + v) % n]);
    const hands = [];
    for (let i = 0; i < n; i++) { const p = (i + v) % n; hands.push(p === v ? S.hands[p].slice() : S.hands[p].map(() => -1)); }
    const bub = {};
    for (const k in ui.bubble) bub[rot(+k)] = ui.bubble[k];
    return {
      round: G.round, names: rotArr(G.names), tally: rotArr(G.tally),
      S: {
        n, hands, draw: S.draw.map(() => -1),
        pile: S.pile.slice(-12).map(e => ({ id: e.id, r: e.r, s: e.s, k: e.k, m: e.m, by: rot(e.by), t: e.t })),
        turn: rot(S.turn), pend: S.pend, out: S.out, owed: S.owed, seg: S.seg, cover: S.cover, over: S.over, winner: rot(S.winner), shuffles: S.shuffles
      },
      last: G.rem.last, now: G.rem.now, log: G.rem.log.slice(-30), bubble: bub, sfx: G.rem.sfx,
      req: G.req ? { id: G.req.id, kind: G.req.kind, call: G.req.call, by: G.req.by == null ? undefined : rot(G.req.by) } : null
    };
  }
  function pushView(force) {
    if (!G || G.role !== 'host' || net.state !== 'game' || !G.rem) return;
    const vw = viewFor(1), body = JSON.stringify(vw);
    if (body === G.lastBody) { if (!force) return; }
    else { G.lastBody = body; G.vc++; }
    send(net.peerId, { t: 'view', room: net.room, from: net.id, c: G.vc, view: vw });
  }
  function startHost() {
    closeSheet();
    net.tally = [0, 0]; net.round = 0;
    startRound(true);
  }
  function startGuest() {
    closeSheet();
    gid++;
    resetBoard();
    G = { id: gid, online: true, role: 'guest', S: null, names: [net.name, net.peerName], tally: [0, 0], round: 0, log: [], started: true, vc: 0, reqId: 0, answered: null, sfxN: -1, endRound: 0 };
    ui.last = `Verbunden mit ${net.peerName}.`; ui.now = 'Die Karten werden verteilt.'; ui.warn = '';
    $('#last').textContent = ui.last; $('#now').textContent = ui.now; $('#now').className = 'now';
    $('#combo').innerHTML = ''; $('#opps').innerHTML = '';
    $('#bDraw').disabled = true; $('#bPlay').disabled = true; $('#bTip').disabled = true; $('#me').classList.remove('on');
  }
  function answer(id, data) {
    if (!G || G.role !== 'guest') return;
    const msg = Object.assign({ t: 'ans', room: net.room, from: net.id, id }, data);
    G.answered = { id, msg, t: Date.now() };
    send(net.peerId, msg);
  }
  function startReq(rq) {
    const g = G, alive = () => G === g && g.reqId === rq.id;
    if (rq.kind === 'turn') {
      ui.sel.clear(); ui.tip = null;
      ui.now = turnText();
      humanInput().then(act => {
        if (!alive()) return;
        ui.sel.clear(); ui.now = '';
        answer(rq.id, { act: act.draw ? { draw: true } : { mv: packMove(act.mv) } });
        render();
      });
    } else if (rq.kind === 'call') {
      humanCall(rq.call).then(ok => { if (!alive()) return; if (ok) buzz(20); answer(rq.id, { ok }); });
    } else if (rq.kind === 'bomb') {
      const bombs = bombMoves(g.S, g.S.hands[0], true);
      if (!bombs.length) { answer(rq.id, {}); return; }
      const nm = pname(rq.by) || net.peerName;
      confirmTimed(`${nm} will ausmachen`, `${nm} hat Butter gerufen und ist nach der 8 nochmal dran. Nur eine Bombe hält das jetzt auf.`, 'Bombe werfen', 'Laufen lassen', 8000)
        .then(yes => (yes && alive() ? choose('Bombe werfen', bombs) : null))
        .then(mv => { if (alive()) answer(rq.id, mv ? { mv: packMove(mv) } : {}); });
    }
  }
  function onView(m) {
    const vw = m.view, g = G;
    if (!g || g.role !== 'guest' || !vw || !vw.S || !Array.isArray(vw.S.hands) || !Array.isArray(vw.S.pile) || !vw.S.pile.length) return;
    if (typeof m.c !== 'number' || vw.round < g.round || (m.c < g.vc && vw.round === g.round)) return;
    const rq = vw.req;
    if (m.c === g.vc && g.S && vw.round === g.round) {      // Wiederholung als Lebenszeichen: Antwort notfalls nochmal schicken
      if (rq && g.answered && g.answered.id === rq.id && Date.now() - g.answered.t > 2500) { g.answered.t = Date.now(); send(net.peerId, g.answered.msg); }
      return;
    }
    if (vw.round !== g.round) {
      resetBoard();
      if (ui.sheetTag === 'end' || ui.sheetTag === 'choose' || ui.sheetTag === 'confirm') closeSheet();
      g.reqId = 0; g.answered = null;
    }
    const first = !g.S;
    g.S = vw.S; g.vc = m.c; g.round = vw.round; g.log = Array.isArray(vw.log) ? vw.log.map(String) : [];
    if (Array.isArray(vw.names)) g.names = vw.names.map(x => cleanName(x) || 'Gast');
    if (Array.isArray(vw.tally)) g.tally = vw.tally.map(x => +x || 0);
    ui.last = String(vw.last || '');
    ui.bubble = {};
    if (vw.bubble) for (const k in vw.bubble) ui.bubble[k] = String(vw.bubble[k]).slice(0, 12);
    if (vw.sfx && vw.sfx.n !== g.sfxN) { const was = g.sfxN; g.sfxN = vw.sfx.n; if (!first && was >= 0) sfx(String(vw.sfx.k), true); }
    const newId = rq ? rq.id : 0;
    if (newId !== g.reqId) {
      g.reqId = newId; g.answered = null;
      if (ui.waiting) stopInput();
      if (ui.callFin) ui.callFin(false);
      if (ui.sheetTag === 'confirm' || ui.sheetTag === 'choose') closeSheet();
      if (rq) startReq(rq);
    }
    if (!rq) ui.now = String(vw.now || '');
    render();
    if (g.S.over && g.endRound !== g.round) {
      g.endRound = g.round;
      setTimeout(() => { if (G === g && g.S.over && g.endRound === g.round) endSheet(); }, 1100);
    }
  }

  /* ---------- Start ---------- */
  function wire() {
    $('#bPlay').addEventListener('click', tryPlay);
    $('#bDraw').addEventListener('click', () => submit({ draw: true }));
    $('#deck').addEventListener('click', () => { if (ui.waiting) submit({ draw: true }); });
    $('#bTip').addEventListener('click', tip);
    $('#bSort').addEventListener('click', () => { cfg.sort = cfg.sort === 'suit' ? 'rank' : 'suit'; save('bb_cfg', cfg); render(); });
    $('#bRules').addEventListener('click', () => { const t = ui.sheetTag; if (['lobby', 'gone', 'confirm', 'choose', 'rules'].includes(t)) return; rulesSheet(t === 'end' ? endSheet : t === 'start' ? startSheet : t === 'menu' ? onlineMenu : null); });
    $('#bMenu').addEventListener('click', () => { if (['lobby', 'gone', 'end', 'confirm', 'choose'].includes(ui.sheetTag)) return; startSheet(); });
    $('#bSound').addEventListener('click', () => { cfg.sound = !cfg.sound; save('bb_cfg', cfg); if (cfg.sound) sfx('play', true); render(); $('#bSound').setAttribute('aria-pressed', cfg.sound ? 'true' : 'false'); });
    $('#status').addEventListener('click', logSheet);
    $('#combo').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b || !ui.waiting) return;
      ui.sel = new Set(b.dataset.key.split(',').map(Number)); ui.tip = null; render();
    });
    $('#sheet').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.id === 'nick') { e.preventDefault(); if (net.state === 'off' || net.state === 'error') goSearch(); } });
    let rz = 0;
    window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 80); });
    window.addEventListener('pagehide', () => { if (net.state !== 'off') netOff(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !$('#sheet').hidden && ui.sheetClose) { const c = ui.sheetClose; closeSheet(); c(); }
    });
  }
  function start(data) {
    wire();
    if (data && data.S && data.S.hands && data.started && !data.S.over) {
      resetBoard();
      roundSP = data.round || 1;
      G = { id: ++gid, S: data.S, round: roundSP, pk: data.pk || 0, mv: data.mv || 0, log: data.log || [], started: true, names: BOTS.slice(0, data.S.n), tally: tally.w };
      ui.shuffles = G.S.shuffles || 0;
      ui.last = 'Weiter geht es.';
      render(); loop();
    } else { deal(false, false); startSheet(); }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => (G && G.S && !G.online ? { S: G.S, round: G.round, pk: G.pk, mv: G.mv, log: G.log.slice(-40), started: G.started } : {}));
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
  window.__bb = { get G() { return G; }, ui, cfg, net };
})();

</script>
</body>
</html>
